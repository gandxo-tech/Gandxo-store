<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion admin — Gandxo Store</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="responsive.css" />
</head>
<body class="auth-body">
  <main class="auth-wrap">
    <a href="index.html" class="logo auth-logo">
      <span class="logo-mark">GS</span>
      <span class="logo-text">GANDXO<em>STORE</em></span>
    </a>

    <form id="login-form" class="auth-form" novalidate>
      <h1>Connexion administrateur</h1>
      <p class="auth-sub">Accès réservé à la gestion de Gandxo Store.</p>

      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" name="email" required autocomplete="username" />

      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" />

      <p id="login-error" class="form-error" role="alert" hidden></p>

      <button type="submit" class="btn-primary" id="login-submit">Se connecter</button>
      <a href="index.html" class="btn-ghost">← Retour au store</a>
    </form>
  </main>

  <script type="module">
    import { login } from "./auth.js";
    import { checkIsAdmin } from "./auth.js";

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("login-error");
    const submitBtn = document.getElementById("login-submit");

    const params = new URLSearchParams(window.location.search);
    if (params.get("erreur") === "droits") {
      errorBox.textContent = "Ce compte n'a pas les droits administrateur.";
      errorBox.hidden = false;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.hidden = true;
      submitBtn.disabled = true;
      submitBtn.textContent = "Connexion…";

      try {
        const user = await login(form.email.value.trim(), form.password.value);
        if (!checkIsAdmin(user)) {
          errorBox.textContent = "Ce compte n'a pas les droits administrateur.";
          errorBox.hidden = false;
          submitBtn.disabled = false;
          submitBtn.textContent = "Se connecter";
          return;
        }
        window.location.href = "admin.html";
      } catch (err) {
        console.error(err);
        errorBox.textContent = "Identifiants incorrects. Vérifie ton e-mail et ton mot de passe.";
        errorBox.hidden = false;
        submitBtn.disabled = false;
        submitBtn.textContent = "Se connecter";
      }
    });
  </script>
</body>
</html>
